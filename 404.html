  <style>
    :root {
      --night: #1C1A33;
      --night-2: #15132A;
      --card: #221F3A;
      --orange: #F26A1B;
      --pulp: #FF9A4A;
      --rind: #D2500F;
      --pith: #FFF1E6;
      --mute: #57506E;
      --mute-d: #C9C4DE;
      --faint: #8C87A6;
      --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
      --serif: "Instrument Serif", Georgia, serif;
      --mono: "IBM Plex Mono", "Courier New", monospace;
      --ease: cubic-bezier(.2, .8, .2, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--night);
      color: var(--pith);
      font-family: var(--display);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(242, 106, 27, 0.15), transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .badge {
      font-family: var(--mono);
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--pulp);
      background: rgba(242, 106, 27, 0.12);
      border: 1px solid rgba(242, 106, 27, 0.25);
      padding: 6px 14px;
      border-radius: 999px;
    }

    .code {
      font-size: clamp(72px, 16vw, 130px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, var(--pith) 30%, var(--pulp) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .title {
      font-family: var(--serif);
      font-style: italic;
      font-size: clamp(24px, 5vw, 36px);
      font-weight: 400;
      color: var(--mute-d);
      line-height: 1.2;
    }

    .desc {
      font-size: 16px;
      color: var(--faint);
      line-height: 1.6;
      max-width: 440px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      padding: 14px 28px;
      background: var(--orange);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      border-radius: 999px;
      box-shadow: 0 10px 30px rgba(242, 106, 27, 0.35);
      transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease), background 0.25s var(--ease);
    }

    .btn:hover {
      background: var(--pulp);
      transform: translateY(-2px);
      box-shadow: 0 14px 36px rgba(242, 106, 27, 0.45);
    }

    .btn svg {
      transition: transform 0.2s ease;
    }

    .btn:hover svg {
      transform: translateX(-3px);
    }
  </style>
</head>

<body>
  <div class="container">
    <span class="badge">404 Error</span>
    <h1 class="code">404</h1>
    <h2 class="title">This frame does not exist.</h2>
    <p class="desc">The page you were looking for has moved or dissolved into the void. Head back home to continue creating.</p>
    <a href="/" class="btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      <span>Back to OranzAI</span>
    </a>
  </div>
</body>

</html>
